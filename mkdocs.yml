site_name: ibo-biomech
site_description: A Python library for loading, processing and converting biomechanical motion-capture data.
repo_url: https://github.com/Talhauzumcu/ibo-biomech
repo_name: Talhauzumcu/ibo-biomech

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            merge_init_into_class: true
            docstring_section_style: table

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]

nav:
  - Home: index.md
  - API Reference:
      - Handlers: api/handlers.md
      - Containers: api/containers.md
      - Conversion: api/conversion.md
      - Utilities: api/utils.md
